# APPLICATION SETTINGS
spring.application.name=book-catalogue-web-service
server.port=9001

# BACKEND API CONNECTION
book.api.base-url=http://localhost:9000/api/books

# TEMPLATE (THYMELEAF) CONFIGURATION
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8



# LOGGING
logging.level.org.springframework.web=INFO
logging.level.com.payu.assessment.bookcatalogueweb=DEBUG

# Disable the default Spring Boot error page
server.error.whitelabel.enabled=false
server.error.path=/error

# MISC
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true
