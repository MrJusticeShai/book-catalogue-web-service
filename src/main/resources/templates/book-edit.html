<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Book</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/books.css}">
</head>
<body class="container mt-5">

<h1 class="text-center mb-4">✏️ Edit Book Details</h1>

<div class="card shadow-lg p-4 rounded-3 mx-auto" style="max-width: 700px;">
    <!-- ✅ Use ISBN instead of ID in the action -->
    <form th:action="@{/books/update/{isbn}(isbn=${book.isbn})}" th:object="${book}" method="post">

        <div class="mb-3">
            <label class="form-label fw-semibold">Book Name</label>
            <input type="text" th:field="*{name}" class="form-control" placeholder="Enter book name" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">ISBN</label>
            <!-- ISBN is now the key identifier, make it readonly -->
            <input type="text" th:field="*{isbn}" class="form-control" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Publish Date (dd/MM/yyyy)</label>
            <input type="text" th:field="*{publishDate}" class="form-control" placeholder="24/10/2025" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Price (ZAR)</label>
            <input type="number" th:field="*{price}" class="form-control" step="0.01" min="0" placeholder="0.00" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Book Type</label>
            <select class="form-select" th:field="*{bookType}" required>
                <option value="">-- Select Type --</option>
                <option value="HARDCOVER" th:selected="${book.bookType == 'HARDCOVER'}">Hardcover</option>
                <option value="SOFTCOVER" th:selected="${book.bookType == 'SOFTCOVER'}">Softcover</option>
                <option value="EBOOK" th:selected="${book.bookType == 'EBOOK'}">E-Book</option>
                <option value="AUDIOBOOK" th:selected="${book.bookType == 'AUDIOBOOK'}">Audiobook</option>
            </select>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a th:href="@{/books}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-success">Save Changes</button>
        </div>
    </form>
</div>

</body>
</html>
