<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - Book Catalogue</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/books.css}">
</head>
<body class="container mt-5 text-center">

<div class="card shadow-lg border-0 mx-auto" style="max-width: 600px;">
    <div class="card-body py-5">
        <h1 class="display-4 text-danger fw-bold mb-3">Oops!</h1>

        <h4 th:text="${errorTitle}">Something went wrong</h4>
        <p class="text-muted mb-4" th:text="${errorMessage}">
            An unexpected error occurred while processing your request.
        </p>

        <img th:src="@{/images/error-illustration.svg}" alt="Error illustration"
             style="max-width: 200px; opacity: 0.8;" class="mb-4"/>

        <div>
            <a th:href="@{/books}" class="btn btn-outline-primary me-2">← Back to Books</a>
        </div>
    </div>
</div>

</body>
</html>
