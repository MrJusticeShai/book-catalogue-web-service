<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Books</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/books.css}">
</head>
<body class="container mt-5">

<h1 class="text-center mb-4">📚 My Book Catalogue</h1>

<div class="d-flex justify-content-between mb-4">
    <a th:href="@{/books/create}" class="btn btn-primary">+ Add New Book</a>
    <div class="btn-group" role="group">
        <button class="btn btn-outline-secondary" onclick="toggleView('list')">List View</button>
        <button class="btn btn-outline-secondary" onclick="toggleView('grid')">Grid View</button>
    </div>
</div>

<div class="row" id="booksContainer" th:if="${books.size() > 0}">
    <div class="col-md-6 mb-3 book-card" th:each="book : ${books}">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title" th:text="${book.name}">Book Name</h5>
                <p><strong>ISBN:</strong> <span th:text="${book.isbn}"></span></p>
                <p><strong>Published:</strong> <span th:text="${book.publishDate}"></span></p>
                <p><strong>Price:</strong> R<span th:text="${book.price}"></span></p>
                <p><strong>Type:</strong> <span th:text="${book.bookType}"></span></p>

                <div class="d-flex justify-content-end mt-3">
                    <a th:href="@{'/books/edit/' + ${book.isbn}}" class="btn btn-success btn-sm me-2">Edit</a>
                    <a th:href="@{'/books/delete/' + ${book.isbn}}" onclick="return confirm('Are you sure you want to delete this book?');" class="btn btn-danger btn-sm">Delete</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/books.js}"></script>
</body>
</html>
